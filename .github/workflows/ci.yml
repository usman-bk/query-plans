name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to a major version on purpose. The plan assertions are
        # written against what Postgres 16 chooses, and a major version
        # changing its mind is exactly what they exist to catch, so that
        # should be a deliberate bump rather than a surprise.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plans_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          u=$(gofmt -l .)
          if [ -n "$u" ]; then echo "gofmt would change:"; echo "$u"; exit 1; fi

      # The parser and the requirements have to be testable without a
      # database, and a skip that becomes permanent is how that stops being
      # true.
      - name: Test with nothing external
        run: go test -race ./...

      - name: Test against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/plans_test?sslmode=disable
        run: go test -race ./...

      - name: Print the before and after
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/plans_test?sslmode=disable
        run: go run ./cmd/planbench -load
